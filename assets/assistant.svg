<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="title description">
  <title id="title">Imbalier</title>
  <desc id="description">Imbalier 小助手；采用现有产品图标，圆角卡片与柔和外阴影。</desc>
  <defs>
    <clipPath id="rounded-card"><rect x="28" y="16" width="200" height="200" rx="44"/></clipPath>
    <filter id="soft-shadow" x="-25%" y="-25%" width="150%" height="160%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="9" stdDeviation="8" flood-color="#101828" flood-opacity="0.18"/>
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#101828" flood-opacity="0.12"/>
    </filter>
  </defs>
  <g filter="url(#soft-shadow)">
    <image x="28" y="16" width="200" height="200" preserveAspectRatio="xMidYMid slice" clip-path="url(#rounded-card)" xlink:href="data:image/webp;base64,"/>
  </g>
</svg>
